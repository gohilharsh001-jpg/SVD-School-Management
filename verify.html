<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hall Ticket Verification - SVD School</title>
<style>body{font-family:Arial,sans-serif;background:#eef4f8;color:#17365d;margin:0}.wrap{max-width:760px;margin:24px auto;padding:16px}.card{background:#fff;border:1px solid #d6e1e8;border-radius:16px;padding:22px;box-shadow:0 5px 20px #17365d12}.ok{display:inline-block;background:#e8f7ec;color:#167a25;border:1px solid #9ad5a5;padding:7px 12px;border-radius:999px;font-weight:800}.warn{background:#fff7e6;color:#8a5a00;border:1px solid #f0cf88;padding:10px;border-radius:10px}.head{text-align:center;border-bottom:1px solid #d6e1e8;padding-bottom:15px;margin-bottom:16px}.meta{display:grid;grid-template-columns:1fr 1fr;gap:9px}.meta div{border:1px solid #ccd8e0;padding:10px;border-radius:8px}.schedule{width:100%;border-collapse:collapse;margin-top:16px}.schedule th,.schedule td{border:1px solid #9db6c9;padding:9px;text-align:center}.schedule th{background:#e6f0f6}@media(max-width:600px){.meta{grid-template-columns:1fr}.wrap{margin:8px auto;padding:8px}}@media print{body{background:#fff}.wrap{max-width:none;margin:0}.card{box-shadow:none;border:0}}</style></head>
<body><div class="wrap"><div class="card" id="app"><div class="head"><h2>🎫 Hall Ticket Verification</h2><div id="school"></div></div><div id="content"></div></div></div>
<script>
function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
function decodeLegacy(){
  const token=new URLSearchParams(location.search).get('v');
  if(!token)return null;
  const b64=token.replace(/-/g,'+').replace(/_/g,'/')+'='.repeat((4-token.length%4)%4);
  const bin=atob(b64);
  const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));
  return JSON.parse(new TextDecoder('utf-8').decode(bytes));
}
try{
  const p=new URLSearchParams(location.search);
  let x=decodeLegacy();
  if(!x){
    let exams=[];
    const rawExams=p.get('x');
    if(rawExams){
      try { exams=JSON.parse(rawExams); if(!Array.isArray(exams)) exams=[]; }
      catch(parseError) { exams=[]; }
    } else {
      const q=p.get('q')||'';
      exams=q?q.split('|').filter(Boolean).map(row=>{
        const a=row.split('~');
        return {date:a[0]||'',time:a[1]||'',exam:a[2]||'',room:a[3]||'',seat:a[4]||''};
      }):[];
    }
    x={
      school:p.get('school')||'Shree S.V. Doshi Highschool, Kumbhan',
      name:p.get('n')||'',
      ctsId:p.get('c')||'',
      gr:p.get('g')||'',
      roll:p.get('r')||'',
      standard:p.get('s')||'',
      division:p.get('d')||'',
      examName:p.get('e')||'',
      exams
    };
  }
  if(!x.name && !x.ctsId && !x.gr && !x.roll) throw new Error('QR data not found.');
  document.title='Hall Ticket Verification - '+(x.school||'SVD School');
  document.getElementById('school').innerHTML='<b>'+esc(x.school||'Shree S.V. Doshi Highschool, Kumbhan')+'</b>';
  const rows=(x.exams||[]).map(e=>'<tr><td>'+esc(e.date)+'</td><td>'+esc(e.time)+'</td><td>'+esc(e.exam)+'</td><td>'+esc(e.room)+'</td><td>'+esc(e.seat)+'</td></tr>').join('');
  document.getElementById('content').innerHTML=
    '<p><span class="ok">✓ QR DATA VERIFIED</span></p>'+
    '<div class="warn"><b>Verified from QR:</b> This page displays the information embedded in the QR code. It does not require Supabase.</div>'+
    '<div class="meta">'+
    '<div><b>Student Name</b><br>'+esc(x.name)+'</div>'+
    '<div><b>CTS ID</b><br>'+esc(x.ctsId)+'</div>'+
    '<div><b>GR No.</b><br>'+esc(x.gr)+'</div>'+
    '<div><b>Roll No.</b><br>'+esc(x.roll)+'</div>'+
    '<div><b>Standard / Division</b><br>'+esc(x.standard)+' / '+esc(x.division)+'</div>'+
    '<div><b>Exam</b><br>'+esc(x.examName)+'</div>'+
    '</div>'+
    (rows?'<h3>Exam Schedule</h3><table class="schedule"><tr><th>Date</th><th>Time</th><th>Subject</th><th>Room</th><th>Seat</th></tr>'+rows+'</table>':'');
}catch(e){
  document.getElementById('content').innerHTML='<p style="color:#b42318;font-weight:700">Invalid or incomplete QR code.</p><p>'+esc(e.message)+'</p>';
}
</script></body></html>
