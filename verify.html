<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hall Ticket Verification - SVD School</title>
<style>
:root{--navy:#17365d;--blue:#244f7c;--line:#bfd0de;--pale:#edf4f9}*{box-sizing:border-box}body{font-family:Arial,sans-serif;background:#eef4f8;color:#172b45;margin:0}.wrap{max-width:900px;margin:22px auto;padding:14px}.card{background:#fff;border:1px solid #d6e1e8;border-radius:14px;padding:24px;box-shadow:0 5px 20px #17365d12}.ticket{border:2px solid var(--navy);padding:18px;position:relative}.head{text-align:center;border-bottom:2px solid var(--navy);padding-bottom:12px;margin-bottom:14px}.school{font-size:24px;font-weight:800;color:var(--navy)}.address{margin-top:5px;font-size:13px}.banner{text-align:center;background:var(--navy);color:#fff;font-weight:800;font-size:19px;padding:9px;margin-bottom:14px}.verified{text-align:center;background:#e8f7ec;color:#167a25;border:1px solid #9ad5a5;padding:7px;border-radius:6px;font-weight:800;margin-bottom:12px}.meta{display:grid;grid-template-columns:1fr 1fr;gap:8px}.meta div{border:1px solid var(--line);padding:9px;border-radius:5px;min-height:48px;overflow-wrap:anywhere}.meta b{display:block;color:var(--navy);font-size:12px;margin-bottom:4px}.section{font-weight:800;color:var(--navy);margin:18px 0 7px}.schedule{width:100%;border-collapse:collapse;font-size:13px}.schedule th,.schedule td{border:1px solid #829bb0;padding:8px;text-align:left}.schedule th{background:#e6f0f6;color:var(--navy)}.note{font-size:12px;line-height:1.5;white-space:pre-wrap}.footer{display:flex;justify-content:space-between;gap:20px;margin-top:28px;align-items:end}.signature{text-align:center;min-width:140px;border-top:1px solid #7890a5;padding-top:6px;font-size:12px}.actions{text-align:center;margin:14px}.btn{background:var(--navy);color:white;border:0;border-radius:6px;padding:10px 18px;font-weight:700;cursor:pointer}.error{color:#b42318;font-weight:700}@media(max-width:600px){.wrap{margin:4px auto;padding:6px}.card{padding:8px}.ticket{padding:9px}.school{font-size:18px}.banner{font-size:16px}.meta{grid-template-columns:1fr}.schedule{font-size:11px}.schedule th,.schedule td{padding:5px}.footer{gap:10px}}@media print{body{background:#fff}.wrap{max-width:none;margin:0;padding:0}.card{box-shadow:none;border:0;padding:0}.actions,.verified{display:none}.ticket{border:2px solid #17365d;break-inside:avoid}}
</style></head><body><div class="wrap"><div class="card"><div id="content"></div></div><div class="actions"><button class="btn" onclick="window.print()">Print / Save as PDF</button></div></div>
<script>
function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
function decodeToken(token){const b64=token.replace(/-/g,'+').replace(/_/g,'/')+'='.repeat((4-token.length%4)%4);const bin=atob(b64);const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));return JSON.parse(new TextDecoder('utf-8').decode(bytes));}
try{
 const p=new URLSearchParams(location.search);let x=null;
 if(p.get('v')) x=decodeToken(p.get('v'));
 else if(p.get('q')||p.get('n')){const q=p.get('q')||'';const exams=q?q.split('|').filter(Boolean).map(row=>{const a=row.split('~');return {date:a[0]||'',time:a[1]||'',exam:a[2]||'',room:a[3]||'',seat:a[4]||''}}):[];x={school:p.get('school')||'Shree S.V. Doshi Highschool, Kumbhan',schoolAddress:p.get('addr')||'',schoolPhone:p.get('phone')||'',name:p.get('n')||'',ctsId:p.get('c')||'',gr:p.get('g')||'',roll:p.get('r')||'',standard:p.get('s')||'',division:p.get('d')||'',examName:p.get('e')||'',exams};}
 if(!x||(!x.name&&!x.roll&&!x.gr&&!x.ctsId)) throw new Error('QR data not found. Please generate the Hall Ticket again from the latest version.');
 document.title='Hall Ticket - '+(x.name||'Student');
 const rows=(x.exams||[]).map(e=>'<tr><td>'+esc(e.date)+'</td><td>'+esc(e.time)+'</td><td>'+esc(e.exam)+'</td><td>'+esc(e.room)+'</td><td>'+esc(e.seat)+'</td></tr>').join('');
 document.getElementById('content').innerHTML='<div class="ticket"><div class="head"><div class="school">'+esc(x.school||'Shree S.V. Doshi Highschool, Kumbhan')+'</div><div class="address">'+esc(x.schoolAddress||'')+(x.schoolPhone?' | Phone: '+esc(x.schoolPhone):'')+'</div></div><div class="banner">'+esc(x.examName||'HALL TICKET').toUpperCase()+'</div><div class="verified">✓ QR DATA VERIFIED</div><div class="meta"><div><b>Student Name</b>'+esc(x.name)+'</div><div><b>CTS ID</b>'+esc(x.ctsId||'-')+'</div><div><b>GR No.</b>'+esc(x.gr||'-')+'</div><div><b>Roll No.</b>'+esc(x.roll||'-')+'</div><div><b>Standard / Division</b>'+esc(x.standard||'-')+' / '+esc(x.division||'-')+'</div><div><b>Room No.</b>'+esc(x.roomNo||'-')+'</div><div><b>Seat No.</b>'+esc(x.seatNo||'-')+'</div>'+(x.mobile?'<div><b>Mobile</b>'+esc(x.mobile)+'</div>':'')+'</div>'+(rows?'<div class="section">EXAM SCHEDULE</div><table class="schedule"><thead><tr><th>Date</th><th>Time</th><th>Subject</th><th>Room</th><th>Seat</th></tr></thead><tbody>'+rows+'</tbody></table>':'<p>No exam schedule was embedded in this QR code.</p>')+(x.footer?'<div class="section">IMPORTANT INSTRUCTIONS</div><div class="note">'+esc(x.footer)+'</div>':'')+'<div class="footer"><div class="note">Please keep this hall ticket during the examination.</div><div class="signature">'+esc(x.principal||'Principal')+'</div></div></div>';
}catch(e){document.getElementById('content').innerHTML='<p class="error">Invalid or incomplete QR code.</p><p>'+esc(e.message)+'</p>';}
</script></body></html>
