<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Hall Ticket & Result Portal</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="portal_config.js"></script><style>body{font-family:Arial,sans-serif;background:#eef4f8;margin:0;color:#17365d}.wrap{max-width:900px;margin:24px auto;padding:16px}.card{background:#fff;border:1px solid #d6e1e8;border-radius:14px;padding:20px;box-shadow:0 5px 20px #17365d12}.row{display:flex;gap:10px;flex-wrap:wrap}input,button{padding:12px;border-radius:8px;border:1px solid #bccbd5;font-size:16px}input{flex:1;min-width:220px}button{background:#1f4e78;color:white;cursor:pointer}.muted{color:#647684}.error{color:#b42318;font-weight:700}.ok{color:#167a25;font-weight:700}.sheet{margin-top:18px;border:1px solid #ccd8e0;padding:20px;background:white}.meta{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.meta div{border:1px solid #ccd8e0;padding:8px}.schedule,.result{width:100%;border-collapse:collapse;margin-top:15px}.schedule th,.schedule td,.result th,.result td{border:1px solid #9db6c9;padding:8px;text-align:center}.schedule th,.result th{background:#e6f0f6}.actions{margin:14px 0}@media(max-width:650px){.meta{grid-template-columns:1fr 1fr}}@media print{.no-print{display:none!important}body{background:#fff}.wrap{margin:0;max-width:none}.card{box-shadow:none;border:0}}</style></head><body><div class="wrap"><div class="card no-print"><h2>🌐 Student Portal</h2><p class="muted">CTS ID નાખીને Hall Ticket અને Result જુઓ.</p><div class="row"><input id="cts" placeholder="Enter CTS ID"><button id="find">Find Student</button></div><div id="msg" style="margin-top:10px"></div></div><div id="out"></div></div><script>
const cfg=window.HALL_TICKET_ONLINE_CONFIG||{};const client=window.supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY);const params=new URLSearchParams(location.search);if(params.get('cts'))document.getElementById('cts').value=params.get('cts');
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
function grade(p){if(p>=90)return'A+';if(p>=80)return'A';if(p>=70)return'B+';if(p>=60)return'B';if(p>=50)return'C';if(p>=33)return'D';return'F';}
function render(data){const s=data.student,school=data.school||{},exams=data.exams||[],rooms=data.rooms||[],results=data.results||{};const rows=exams.map(e=>{const rec=(results[String(e.id)]||{})[String(s.id)]||{};return {e,m:rec.marks===''||rec.marks==null?'':Number(rec.marks),r:rec.remarks||''};});const valid=rows.filter(x=>x.m!=='');const total=valid.reduce((a,x)=>a+x.m,0),max=valid.reduce((a,x)=>a+(Number(x.e.maxMarks)||100),0),pct=max?total/max*100:0;document.getElementById('out').innerHTML=`<div class="sheet"><div style="text-align:center">${data.customize?.logo?`<img src="${data.customize.logo}" style="max-height:70px;max-width:140px"><br>`:''}<b>${esc(school.name||'School')}</b><h2>Student Hall Ticket / Result</h2><div>${esc(school.address||'')}</div></div><div class="meta"><div><b>Name</b><br>${esc(s.name)}</div><div><b>CTS ID</b><br>${esc(s.ctsId)}</div><div><b>Roll No.</b><br>${esc(s.roll)}</div><div><b>Standard / Div.</b><br>${esc(s.std)} / ${esc(s.div)}</div></div><h3>🎫 Hall Ticket</h3><table class="schedule"><tr><th>Date</th><th>Time</th><th>Subject</th><th>Room</th><th>Seat</th></tr>${exams.map(e=>{const a=rooms.find(x=>Number(x.examId)===Number(e.id)&&Number(x.studentId)===Number(s.id));return `<tr><td>${esc(e.date)}</td><td>${esc(e.time)}</td><td>${esc(e.subject)}</td><td>${esc(a?.room||e.room||'')}</td><td>${esc(a?.seat||'')}</td></tr>`}).join('')}</table><h3>📊 Result</h3><table class="result"><tr><th>Subject</th><th>Date</th><th>Max</th><th>Pass</th><th>Marks</th><th>Remarks</th></tr>${rows.map(x=>`<tr><td>${esc(x.e.subject)}</td><td>${esc(x.e.date)}</td><td>${Number(x.e.maxMarks)||100}</td><td>${Number(x.e.passMarks)||33}</td><td>${x.m===' '||x.m===''?'-':x.m}</td><td>${esc(x.r)}</td></tr>`).join('')}</table><p><b>Total:</b> ${total}/${max||'-'} &nbsp; <b>Percentage:</b> ${max?pct.toFixed(2):'-'}% &nbsp; <b>Grade:</b> ${max?grade(pct):'-'}</p><div class="actions no-print"><button onclick="window.print()">🖨️ Print / PDF</button></div></div>`;}
async function findStudent(){const cts=document.getElementById('cts').value.trim();if(!cts){document.getElementById('msg').innerHTML='<span class="error">CTS ID દાખલ કરો.</span>';return;}document.getElementById('msg').textContent='Loading...';const {data,error}=await client.rpc('get_student_portal',{p_school_key:params.get('school')||cfg.SCHOOL_KEY||'main-school',p_cts_id:cts});if(error){document.getElementById('msg').innerHTML='<span class="error">'+esc(error.message)+'</span>';return;}if(!data?.ok){document.getElementById('msg').innerHTML='<span class="error">Student not found.</span>';return;}document.getElementById('msg').innerHTML='<span class="ok">Student found.</span>';render(data);}
document.getElementById('find').onclick=findStudent;document.getElementById('cts').addEventListener('keydown',e=>{if(e.key==='Enter')findStudent();});if(params.get('cts'))findStudent();
</script></body></html>
